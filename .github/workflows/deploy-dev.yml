name: Deploy to Dev (Auto-Redeploy)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup SSH key
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        run: |
          echo "🔄 Starting deployment from GitHub Actions..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'ENDSSH'
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"

            echo "📦 Repo: $(pwd)"
            echo "🌿 Branch: develop"

            # Always deploy the exact remote state (no merge conflicts)
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            git clean -fd

            echo "🔨 Building new image (old container stays up)..."
            # Load production environment variables for build args
            if [ -f "/opt/mikroimathites/.env.production" ]; then
              echo "📄 Loading environment variables from .env.production..."
              set -a
              source /opt/mikroimathites/.env.production
              set +a
            else
              echo "⚠️ Warning: .env.production not found, using defaults"
            fi

            DOCKER_BUILDKIT=0 docker compose build app

            echo "🔄 Restarting app with new image..."
            docker compose up -d --no-deps app

            echo "⏳ Waiting for health..."
            for i in {1..30}; do
              if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
                echo "✅ Healthy"
                break
              fi
              sleep 2
            done

            echo "🔍 Container env check (redacted)..."
            docker exec -i $(docker compose ps -q app) sh -lc 'env | grep -E "NODE_ENV|APP_ENV|NEXT_PUBLIC_SITE_URL|RESEND_FROM_EMAIL|ADMIN_EMAIL" || true'

            echo "✅ Deployment finished"
          ENDSSH