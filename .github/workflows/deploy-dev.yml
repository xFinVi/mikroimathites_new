name: Deploy to Dev (Auto-Redeploy)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "❌ Error: VPS_SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ Error: VPS_HOST secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ Error: VPS_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_APP_PATH }}" ]; then
            echo "❌ Error: VPS_APP_PATH secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are present"

      - name: Setup SSH key
        run: |
          set -e
          echo "🔐 Setting up SSH connection..."

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "🔍 Scanning SSH host: $SSH_HOST"
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "✅ SSH setup completed"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}

      - name: Deploy to VPS
        run: |
          echo "🔄 Starting deployment from GitHub Actions..."
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -o ConnectTimeout=10 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'ENDSSH'
            set -e

            APP_DIR="${{ secrets.VPS_APP_PATH }}"
            ENV_FILE="/opt/mikroimathites/.env.production"

            cd "$APP_DIR" || { echo "❌ Failed to cd to app directory: $APP_DIR"; exit 1; }

            echo "📦 Current directory: $(pwd)"
            echo "🌿 Current branch: $(git branch --show-current)"


            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ Missing env file: $ENV_FILE"
              exit 1
            fi

            git fetch origin
            git checkout develop
            git pull origin develop

            echo "🔨 Building new container..."
            echo "⏱️ Build started at $(date +'%H:%M:%S')"

            # Keep SSH alive during long build
            (while true; do sleep 30; echo "⏳ Build still running... $(date +'%H:%M:%S')"; done) &
            HEARTBEAT_PID=$!

            # Use env file for substitution + build args, and disable BuildKit for cleaner SSH output
            DOCKER_BUILDKIT=0 docker compose --env-file "$ENV_FILE" build || {
              kill $HEARTBEAT_PID 2>/dev/null || true
              echo "❌ Docker build failed"
              docker compose --env-file "$ENV_FILE" logs --tail=80 || true
              exit 1
            }

            kill $HEARTBEAT_PID 2>/dev/null || true
            echo "⏱️ Build finished at $(date +'%H:%M:%S')"

            echo "🔄 Restarting container with new image..."
            docker compose --env-file "$ENV_FILE" up -d --no-deps app || {
              echo "❌ Docker compose up failed"
              docker compose --env-file "$ENV_FILE" logs --tail=120 || true
              exit 1
            }

            echo "⏳ Waiting for application to be ready..."
            sleep 10

            echo "🏥 Checking application health..."
            for i in {1..30}; do
              if curl -f -s http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ Deployment successful - application is healthy!"
                exit 0
              fi
              sleep 2
            done

            echo "❌ Application failed health check after 60 seconds"
            docker compose --env-file "$ENV_FILE" ps || true
            docker compose --env-file "$ENV_FILE" logs --tail=120 app || true
            exit 1
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -T "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'ENDSSH'
            set -e
            cd "${{ secrets.VPS_APP_PATH }}" || exit 1
            ENV_FILE="/opt/mikroimathites/.env.production"

            echo "🔍 Final verification..."
            docker compose --env-file "$ENV_FILE" ps

            if curl -f -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Final verification passed - application is healthy"
            else
              echo "⚠️ Health check failed in verification step"
              docker compose --env-file "$ENV_FILE" logs --tail=120 app || true
              exit 1
            fi
          ENDSSH